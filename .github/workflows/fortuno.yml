name: Fortuno AI

on:
  schedule:
    # Each job is listed twice (summer time + winter time). cloud_run.py ignores the wrong one.
    - cron: "15 12 * * 1-5"   # morning scan + Premarket Brief (8:15 AM ET)
    - cron: "15 13 * * 1-5"
    - cron: "20 13 * * 1-5"   # breakout alerts, part 1 (9:20 AM ET)
    - cron: "20 14 * * 1-5"
    - cron: "55 18 * * 1-5"   # breakout alerts, part 2 (2:55 PM ET)
    - cron: "55 19 * * 1-5"
    - cron: "3 21 * * 1-5"    # After-Close Brief (5:03 PM ET)
    - cron: "3 22 * * 1-5"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run right now"
        type: choice
        default: demo-alert
        options:
          - demo-alert
          - morning
          - evening
          - alerts

permissions:
  contents: write

concurrency:
  group: fortuno-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run Fortuno AI
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          TASK: ${{ github.event.inputs.task }}
          FORTUNO_CLOUD: "1"
          PYTHONUNBUFFERED: "1"
        run: python cloud_run.py

      - name: Save today's results
        if: always()
        run: |
          git config user.name "fortuno-bot"
          git config user.email "fortuno-bot@users.noreply.github.com"
          git add -A
          git commit -m "Fortuno data $(date -u +%Y-%m-%d_%H%M)" || echo "Nothing new to save"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
